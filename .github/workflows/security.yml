name: Static site security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Stop obsolete PR checks; every main or manual run keeps its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  presentation-boundary:
    # Fork code is never assigned to the personal PC.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, pc-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node --test tests/security.test.mjs

  fork-review-required:
    name: Fork review required
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    # This label is deliberately never provisioned by the PC scheduler.
    runs-on: [self-hosted, pc-ci-untrusted-fork]
    steps:
      - name: Require full validation from a reviewed first-party branch
        run: exit 1
