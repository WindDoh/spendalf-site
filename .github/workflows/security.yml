name: Static site security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  presentation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node --test tests/security.test.mjs
